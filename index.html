  :root{
    --forest:#152E24;
    --forest-deep:#0D211A;
    --ivory:#F4EFE3;
    --orange:#C1541C;

  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--forest-deep);color:var(--ivory);font-family:'Inter',sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px;}

  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange-soft);font-weight:600;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 4px;}
  .sub{color:var(--sage);font-size:13px;margin-bottom:22px;}

  .hero{
    background:linear-gradient(160deg,var(--forest) 0%, var(--forest-deep) 100%);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 24px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .hero:before{

  }
  .day-count{font-family:'Fraunces',serif;font-size:64px;font-weight:700;line-height:1;color:var(--ivory);}

  .day-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-top:6px;}
  .hero-dates{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--sage);border-top:1px solid var(--line);padding-top:14px;}

  .tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--forest);border-radius:12px;padding:4px;border:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--sage);transition:.15s;}
  .tab.active{background:var(--orange);color:var(--ivory);}

  .card{background:var(--forest);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin-bottom:14px;}
  .card h2{font-family:'Fraunces',serif;font-size:16px;margin:0 0 12px;font-weight:600;}
  .card h2 .n{color:var(--orange-soft);margin-right:6px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-label{font-size:14px;}
  .toggle-sub{font-size:11px;color:var(--sage);margin-top:2px;}

  .switch{width:42px;height:24px;border-radius:12px;background:rgba(244,239,227,0.15);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
  .switch.on{background:var(--orange);}
  .switch .dot{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ivory);transition:.15s;}
  .switch.on .dot{left:21px;}

  textarea, input[type=number], input[type=text]{
    width:100%;background:var(--forest-deep);border:1px solid var(--line);border-radius:8px;
    color:var(--ivory);font-family:'Inter',sans-serif;font-size:13px;padding:10px;resize:vertical;
  }
  textarea:focus, input:focus{outline:1px solid var(--orange-soft);}

  .streak-row{display:flex;gap:10px;margin-top:4px;}
  .streak-pill{flex:1;background:var(--forest-deep);border-radius:10px;padding:12px;text-align:center;}
  .streak-pill b{font-family:'Fraunces',serif;font-size:22px;display:block;color:var(--orange-soft);}
  .streak-pill span{font-size:10px;color:var(--sage);text-transform:uppercase;letter-spacing:.08em;}

  .milestone{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .milestone:last-child{border-bottom:none;}
  .check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--sage);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .check.done{background:var(--orange);border-color:var(--orange);}
  .check.done:after{content:"✓";font-size:12px;color:var(--ivory);}
  .milestone-label{font-size:13.5px;}
  .milestone-label.done{color:var(--sage);text-decoration:line-through;}

  .progress-outer{height:10px;background:var(--forest-deep);border-radius:5px;overflow:hidden;margin:10px 0 6px;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-soft));}
  .progress-text{font-size:12px;color:var(--sage);display:flex;justify-content:space-between;}

  .installments{display:flex;gap:8px;margin-top:12px;}
  .inst{flex:1;background:var(--forest-deep);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;}
  .inst.done{border-color:var(--orange);background:rgba(193,84,28,0.15);}
  .inst .amt{font-family:'Fraunces',serif;font-size:14px;color:var(--ivory);}
  .inst .lbl{font-size:9px;color:var(--sage);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}
  .inst.done .lbl{color:var(--orange-soft);}

  .save-btn{background:var(--orange);color:var(--ivory);border:none;border-radius:9px;padding:12px;width:100%;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
  .save-btn:active{transform:scale(0.99);}
  .ghost-btn{background:transparent;color:var(--orange-soft);border:1px solid var(--orange);border-radius:9px;padding:12px;width:100%;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
  .status{font-size:11px;color:var(--sage);text-align:center;margin-top:8px;min-height:14px;}

  .history-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-date{color:var(--orange-soft);font-weight:600;margin-right:8px;}
  .history-tags{color:var(--sage);}
  .empty{color:var(--sage);font-size:13px;text-align:center;padding:20px 0;}

  .summary-card{background:linear-gradient(165deg,var(--forest),var(--forest-deep));border:1px solid var(--line);border-radius:18px;padding:26px 22px;}
  .summary-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;margin-bottom:2px;}
  .summary-date{font-size:12px;color:var(--sage);margin-bottom:18px;}
  .summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .summary-row:last-of-type{border-bottom:none;}
  .summary-row .v{font-weight:600;}
  .v.yes{color:#7FBF8E;}
  .v.no{color:var(--orange-soft);}
  .v.na{color:var(--sage);}
  .summary-notes{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:#D9D3C4;white-space:pre-wrap;}
  .summary-foot{margin-top:16px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-soft);text-align:center;}
  textarea#copyBox{position:absolute;left:-9999px;}
  input#importFile{display:none;}
  .data-row{display:flex;gap:8px;margin-top:10px;}
  .data-row .save-btn, .data-row .ghost-btn{margin-top:0;}
.vchk{width:20px;height:20px;border:2px solid var(--sage);border-radius:6px;flex:none;margin-top:1px;cursor:pointer}.vchk.done{background:var(--orange);border-color:var(--orange)}

function hasClaudeStorage(){
  return (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
}

async function storageGet(){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(KEY, false);
      return res ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function storageSet(obj){
  if(hasClaudeStorage()){
    try{ await window.storage.set(KEY, JSON.stringify(obj), false); return true; }catch(e){ return false; }
  }
  try{ localStorage.setItem(KEY, JSON.stringify(obj)); return true; }catch(e){ return false; }
}

async function load(){
  const loaded = await storageGet();
  data = loaded || defaultData();
  if(!data.phone) data.phone = { saved: 0, target: 185000, installments: [false,false,false] };
  Object.values(data.entries).forEach(e=>{ if(e.prayed===undefined) e.prayed = null; });
  render();
}

async function save(msg){
  const ok = await storageSet(data);
  flashStatus(ok ? (msg || "Saved") : "Save failed — try again");
}

function flashStatus(msg){
  const el = document.getElementById("status");
  if(!el) return;
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ if(el) el.textContent = ""; }, 2200);
}

  return streak;
}

function bindVision(){
  document.querySelectorAll(".vchk").forEach(el=>{
    el.onclick = ()=>{
      data.vision = data.vision || {};
      const k = el.dataset.g+"_"+el.dataset.i;
      data.vision[k] = !data.vision[k];
      el.classList.toggle("done");
      el.nextElementSibling.classList.toggle("done");
      const d = el.closest("details");
      d.querySelector(".vcount").textContent = d.querySelectorAll(".vchk.done").length+"/"+d.querySelectorAll(".vchk").length;
      save("Saved");
    };
  });
}

function renderHistory(){
  const keys = Object.keys(data.entries).sort().reverse();
  if(keys.length===0) return `<div class="card"><div class="empty">No check-ins yet. Start with today.</div></div>`;
  const rows = keys.map(k=>{
    const e = data.entries[k];
    const tags = [];
    if(e.prayed===true) tags.push("prayed");
    if(e.habitFree===true) tags.push("clean day");
    if(e.habitFree===false) tags.push("reset");
    if(e.gym) tags.push("gym");
    if(e.focused) tags.push("focused");
    if(e.calm) tags.push("calm");
    if(e.showedUp) tags.push("showed up");
    return `<div class="history-item"><span class="history-date">${k}</span><span class="history-tags">${tags.join(" · ")||"—"}</span>${e.notes?`<div style="margin-top:4px;color:#cfd8d0;">${escapeHtml(e.notes)}</div>`:""}</div>`;
  }).join("");
  return `<div class="card"><h2><span class="n">·</span>Log</h2>${rows}</div>`;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.innerText = s; return d.innerHTML;
}

function attachHandlers(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ tab = t.dataset.tab; todayView = "form"; render(); };
  });

  document.querySelectorAll(".switch").forEach(sw=>{
    sw.onclick = ()=>{
      const e = ensureToday();
      const k = sw.dataset.key;
      e[k] = e[k] === true ? false : true;
      render();
    };
  });

  document.querySelectorAll(".check").forEach(c=>{
    c.onclick = ()=>{
      const g = c.dataset.group, i = c.dataset.idx;
      data.milestones[g][i].d = !data.milestones[g][i].d;
      save("Milestone updated");
      render();
    };
  });

  document.querySelectorAll(".inst").forEach(c=>{
    c.onclick = ()=>{
      const i = Number(c.dataset.inst);
      data.phone.installments[i] = !data.phone.installments[i];
      save("Installment updated");
      render();
    };
  });

  const saveToday = document.getElementById("saveToday");
  if(saveToday) saveToday.onclick = ()=>{
    const e = ensureToday();
    const sh = document.getElementById("sleepHours");
    const nt = document.getElementById("notes");
    if(sh) e.sleepHours = sh.value;
    if(nt) e.notes = nt.value;
    save("Today saved");
  };

  const viewSummary = document.getElementById("viewSummary");
  if(viewSummary) viewSummary.onclick = ()=>{
    const e = ensureToday();
    const sh = document.getElementById("sleepHours");
    const nt = document.getElementById("notes");
    if(sh) e.sleepHours = sh.value;
    if(nt) e.notes = nt.value;
    save("Today saved");
    todayView = "summary";
    render();
  };

  const backToForm = document.getElementById("backToForm");
  if(backToForm) backToForm.onclick = ()=>{ todayView = "form"; render(); };

  const copyText = document.getElementById("copyText");
  if(copyText) copyText.onclick = ()=>{
    const e = ensureToday();
    const dc = dayCount();
    const streak = habitStreak();
    const pStreak = prayerStreak();
    const text = buildSummaryText(e, streak, pStreak, dc);
    const box = document.getElementById("copyBox");
    box.value = text;
    box.style.position = "fixed";
    box.style.left = "0";
    box.style.top = "0";
    box.focus();
    box.select();
    try{
      document.execCommand('copy');
      flashStatus("Copied — paste it to Claude");
    }catch(err){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>flashStatus("Copied — paste it to Claude")).catch(()=>flashStatus("Copy failed — select text manually"));
      } else {
        flashStatus("Copy failed — select text manually");
      }
    }
    box.style.position = "";
    box.style.left = "-9999px";
  };

  const saveHouse = document.getElementById("saveHouse");
  if(saveHouse) saveHouse.onclick = ()=>{
    const v = document.getElementById("houseSaved").value;
    data.house.saved = Number(v)||0;
    save("Updated");
    render();
  };

  const savePhone = document.getElementById("savePhone");
  if(savePhone) savePhone.onclick = ()=>{
    const v = document.getElementById("phoneSaved").value;
    const t = document.getElementById("phoneTarget").value;
    data.phone.saved = Number(v)||0;
    if(t && Number(t) > 0) data.phone.target = Number(t);
    save("Updated");
    render();
  };

  const exportBtn = document.getElementById("exportData");
  if(exportBtn) exportBtn.onclick = ()=>{
    try{
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `unfazed-life-reset-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      flashStatus("Backup downloaded — save it somewhere safe");
    }catch(err){
      flashStatus("Export failed — try again");
    }
  };

  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  if(importBtn && importFile){
    importBtn.onclick = ()=> importFile.click();
    importFile.onchange = (ev)=>{
      const file = ev.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (e)=>{
        try{
          const imported = JSON.parse(e.target.result);
          if(!imported.entries) throw new Error("Not a valid backup file");
          data = imported;
          await save("Backup restored");
          render();
        }catch(err){
          flashStatus("Invalid backup file");
        }
      };
      reader.readAsText(file);
      importFile.value = "";
    };
  }
}

load();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
